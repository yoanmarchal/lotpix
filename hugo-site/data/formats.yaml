# Output formats offered by the application (see OutputFormat in src/conversion.rs). The texts
# are in i18n/<language>.yaml: format-<id>-tagline, format-<id>-body and the tag-<id> tags
- ext: WebP
  id: webp
  tags: [adjustable-quality, transparency, animation]
  accent: from-brand-400 to-brand-600
- ext: AVIF
  id: avif
  tags: [adjustable-quality, transparency]
  accent: from-violet-400 to-violet-600
- ext: JPEG
  id: jpeg
  tags: [adjustable-quality, universal]
  accent: from-amber-400 to-orange-500
- ext: PNG
  id: png
  tags: [lossless, transparency]
  accent: from-sky-400 to-blue-600
