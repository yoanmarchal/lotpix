# Chaque entrée est reliée à un fichier de la dernière release GitHub par `match`
# (expression régulière testée sur le nom de l'asset dans assets/js/main.js).
windows:
  name: Windows
  requirements: Windows 10 ou plus récent · x64
  note: L'application signale les nouvelles versions.
  files:
    - id: win-x64
      label: Installateur .exe
      arch: x64
      match: 'setup.*\.exe$'
      primary: true
linux:
  name: Linux
  requirements: Ubuntu 22.04+ ou équivalent · x64 et arm64
  note: Nouvelle version à installer depuis cette page.
  files:
    - id: deb-x64
      label: Paquet .deb
      arch: x64
      match: '(amd64|x86_64|x64)\.deb$'
      primary: true
    - id: deb-arm64
      label: Paquet .deb
      arch: arm64
      match: '(arm64|aarch64)\.deb$'
    - id: appimage-x64
      label: AppImage
      arch: x64
      match: '(amd64|x86_64|x64)\.AppImage$'
    - id: appimage-arm64
      label: AppImage
      arch: arm64
      match: '(arm64|aarch64)\.AppImage$'
