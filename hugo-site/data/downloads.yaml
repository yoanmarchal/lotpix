# Each entry is linked to a file of the latest GitHub release by `match` (regular expression
# tested on the asset name in assets/js/main.js). The texts are in i18n/<language>.yaml:
# download-<system>-requirements, download-<system>-note and the `label` keys
windows:
  name: Windows
  files:
    - id: win-x64
      label: download-installer
      arch: x64
      match: 'setup.*\.exe$'
      primary: true
linux:
  name: Linux
  files:
    - id: deb-x64
      label: download-deb
      arch: x64
      match: '(amd64|x86_64|x64)\.deb$'
      primary: true
    - id: deb-arm64
      label: download-deb
      arch: arm64
      match: '(arm64|aarch64)\.deb$'
    - id: appimage-x64
      label: download-appimage
      arch: x64
      match: '(amd64|x86_64|x64)\.AppImage$'
    - id: appimage-arm64
      label: download-appimage
      arch: arm64
      match: '(arm64|aarch64)\.AppImage$'
