# Preguntas frecuentes
faq-title: "Preguntas frecuentes"
faq-another-question: "¿Otra pregunta?"
faq-open-issue: "Abra una incidencia"
faq-uploads-q: "¿Se envían mis imágenes a Internet?"
faq-uploads-a: "No. Toda la conversión se realiza en su ordenador. Ninguna imagen sale de su equipo y no se recopila ningún dato de uso. El único acceso a la red es la búsqueda de una nueva versión al iniciar, que puede desactivar."
faq-originals-q: "¿Se modifican mis archivos originales?"
faq-originals-a: "Nunca. Las imágenes convertidas se crean junto a los originales, o en la carpeta de salida que elija. Tampoco se sobrescribe nada: si <code>photo.webp</code> ya existe, la salida pasa a ser <code>photo-1.webp</code>."
faq-format-q: "¿Qué formato elegir?"
faq-format-a: "<strong>WebP</strong> para la web, es el mejor compromiso. <strong>AVIF</strong> para los archivos más ligeros. <strong>JPEG</strong> si la imagen debe abrirse en cualquier parte. <strong>PNG</strong> para una calidad sin pérdida con transparencia."
faq-input-q: "¿Qué formatos puedo importar?"
faq-input-a: "JPEG, PNG, GIF, TIFF y WebP. La orientación EXIF se aplica automáticamente y los GIF animados se conservan como WebP animado."
faq-resize-q: "¿Puedo redimensionar mis imágenes a la vez?"
faq-resize-a: "Sí. Active «Redimensionar» y elija un ancho, un alto, un lado más largo o un porcentaje: las proporciones se mantienen y las dimensiones finales de cada imagen se muestran antes de la conversión. Con «Formato original», también puede redimensionar sin cambiar de formato."
faq-context-menu-q: "¿Puedo comprimir imágenes sin abrir la aplicación?"
faq-context-menu-a: "Sí. Haga clic derecho en imágenes o en una carpeta: <strong>Comprimir con Lotpix</strong> ofrece WebP, JPEG, PNG, AVIF o el formato original, y <strong>Redimensionar con Lotpix</strong> ofrece tamaños estándar y los formatos de redes sociales (Instagram, Stories, Facebook, X, YouTube, Pinterest). En Windows 11, las entradas están en «Mostrar más opciones»."
faq-image-converter-q: "Usaba Image Converter, ¿qué debo hacer?"
faq-image-converter-a: "Lotpix es la nueva versión de Image Converter, reescrita por completo. No se instala encima de la anterior: desinstale Image Converter y después instale Lotpix desde esta página. El historial de conversiones no se conserva."
faq-update-q: "¿Cómo actualizo la aplicación?"
faq-update-a: "La aplicación muestra un aviso al iniciar cuando existe una nueva versión. Descárguela desde esta página o desde las releases de GitHub e instálela encima de la anterior."
faq-smartscreen-q: "Windows muestra «Windows protegió su PC», ¿qué hago?"
faq-smartscreen-a: "Windows muestra este aviso para los instaladores que aún no están firmados o que todavía se han descargado poco. Haga clic en <strong>Más información</strong> y después en <strong>Ejecutar de todas formas</strong>. Los instaladores se compilan públicamente a partir del código fuente con GitHub Actions; la firma por SignPath Foundation se está poniendo en marcha (consulte la política de firma más abajo)."
faq-macos-q: "¿Existe una versión para macOS?"
faq-macos-a: "Todavía no hay una versión precompilada. El código es de código abierto bajo licencia MIT; puede ejecutar la aplicación desde el código fuente siguiendo el README."

# Política de firma
signing-title: "Política de firma de código"
signing-what-title: "Qué se firma"
signing-what-text: "La aplicación de Windows (<code>lotpix.exe</code>) y su instalador se compilan y firman con el <a href=\"{{ . }}\">workflow de release</a> de GitHub Actions, únicamente a partir del código de este repositorio. Cada firma se aprueba manualmente antes de aplicarse. Las versiones publicadas antes de implantar la firma no están firmadas."
signing-team-title: "Equipo"
signing-committers: "Autores y revisores:"
signing-approvers: "Aprobadores de las firmas:"
privacy-title: "Privacidad"
privacy-text: "Lotpix procesa las imágenes en su ordenador: no se envía ninguna imagen, ningún nombre de archivo ni ningún dato de uso. El único acceso a la red es la búsqueda de una nueva versión al iniciar, que lee la dirección de la página de la última release en GitHub; se desactiva con la casilla «Buscar actualizaciones» en la parte inferior de la ventana. Esta petición está sujeta a la <a href=\"https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement\">declaración de privacidad de GitHub</a>."

