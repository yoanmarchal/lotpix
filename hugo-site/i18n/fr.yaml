# FAQ
faq-title: "Questions fréquentes"
faq-another-question: "Une autre question ?"
faq-open-issue: "Ouvrez une issue"
faq-uploads-q: "Mes images sont-elles envoyées sur Internet ?"
faq-uploads-a: "Non. Toute la conversion se fait sur votre ordinateur. Aucune image ne quitte votre machine et aucune donnée d'usage n'est collectée. Le seul accès réseau est la recherche d'une nouvelle version au démarrage, que vous pouvez désactiver."
faq-originals-q: "Mes fichiers originaux sont-ils modifiés ?"
faq-originals-a: "Jamais. Les images converties sont créées à côté des originaux, ou dans le dossier de sortie de votre choix. Rien n'est écrasé non plus : si <code>photo.webp</code> existe déjà, la sortie devient <code>photo-1.webp</code>."
faq-format-q: "Quel format choisir ?"
faq-format-a: "<strong>WebP</strong> pour le web, c'est le meilleur compromis. <strong>AVIF</strong> pour les fichiers les plus légers. <strong>JPEG</strong> si l'image doit s'ouvrir partout. <strong>PNG</strong> pour une qualité sans perte avec transparence."
faq-input-q: "Quels formats puis-je importer ?"
faq-input-a: "JPEG, PNG, GIF, TIFF et WebP. L'orientation EXIF est appliquée automatiquement et les GIF animés sont conservés en WebP animé."
faq-resize-q: "Puis-je redimensionner mes images en même temps ?"
faq-resize-a: "Oui. Activez « Redimensionner » et choisissez une largeur, une hauteur, un côté le plus long ou un pourcentage : les proportions sont conservées et les dimensions finales de chaque image s'affichent avant la conversion. Avec « Format d'origine », vous pouvez aussi redimensionner sans changer de format."
faq-context-menu-q: "Puis-je compresser des images sans ouvrir l'application ?"
faq-context-menu-a: "Oui. Faites un clic droit sur des images ou un dossier : <strong>Compresser avec Lotpix</strong> propose WebP, JPEG, PNG, AVIF ou le format d'origine, et <strong>Redimensionner avec Lotpix</strong> propose des tailles standard et les formats des réseaux sociaux (Instagram, Story, Facebook, X, YouTube, Pinterest). Sous Windows 11, les entrées sont dans « Afficher plus d'options »."
faq-image-converter-q: "J'utilisais Image Converter, que dois-je faire ?"
faq-image-converter-a: "Lotpix est la nouvelle version d'Image Converter, entièrement réécrite. Elle ne s'installe pas par-dessus l'ancienne : désinstallez Image Converter, puis installez Lotpix depuis cette page. L'historique des conversions n'est pas repris."
faq-update-q: "Comment mettre à jour l'application ?"
faq-update-a: "L'application affiche un bandeau au démarrage quand une nouvelle version existe. Téléchargez-la depuis cette page ou les releases GitHub, puis installez-la par-dessus l'ancienne."
faq-smartscreen-q: "Windows affiche « Windows a protégé votre ordinateur », que faire ?"
faq-smartscreen-a: "Windows affiche cet avertissement pour les installeurs qui ne sont pas encore signés ou pas encore assez téléchargés. Cliquez sur <strong>Informations complémentaires</strong>, puis sur <strong>Exécuter quand même</strong>. Les installeurs sont compilés publiquement depuis le code source par GitHub Actions ; la signature par SignPath Foundation est en cours de mise en place (voir la politique de signature plus bas)."
faq-macos-q: "Existe-t-il une version macOS ?"
faq-macos-a: "Pas encore de version précompilée. Le code est open source sous licence MIT, vous pouvez lancer l'application depuis les sources en suivant le README."

# Politique de signature
signing-title: "Politique de signature"
signing-what-title: "Ce qui est signé"
signing-what-text: "L'application Windows (<code>lotpix.exe</code>) et son installeur sont compilés et signés par le <a href=\"{{ . }}\">workflow de release</a> GitHub Actions, uniquement à partir du code de ce dépôt. Chaque signature est validée à la main avant d'être appliquée. Les versions publiées avant la mise en place de la signature ne sont pas signées."
signing-team-title: "Équipe"
signing-committers: "Auteurs et relecteurs :"
signing-approvers: "Approbateurs des signatures :"
privacy-title: "Confidentialité"
privacy-text: "Lotpix traite les images sur votre ordinateur : aucune image, aucun nom de fichier ni aucune donnée d'usage n'est envoyé. Le seul accès réseau est la recherche d'une nouvelle version au démarrage, qui lit l'adresse de la page de la dernière release sur GitHub ; elle se désactive par la case « Vérifier les mises à jour » en bas de la fenêtre. Cette requête est soumise à la <a href=\"https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement\">politique de confidentialité de GitHub</a>."

