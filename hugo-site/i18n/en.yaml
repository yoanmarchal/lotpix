# FAQ
faq-title: "Frequently asked questions"
faq-another-question: "Another question?"
faq-open-issue: "Open an issue"
faq-uploads-q: "Are my images sent over the Internet?"
faq-uploads-a: "No. The whole conversion happens on your computer. No image leaves your machine and no usage data is collected. The only network access is the check for a new version at startup, which you can turn off."
faq-originals-q: "Are my original files modified?"
faq-originals-a: "Never. Converted images are created next to the originals, or in the output folder of your choice. Nothing is overwritten either: if <code>photo.webp</code> already exists, the output becomes <code>photo-1.webp</code>."
faq-format-q: "Which format should I choose?"
faq-format-a: "<strong>WebP</strong> for the web, it is the best compromise. <strong>AVIF</strong> for the lightest files. <strong>JPEG</strong> if the image must open everywhere. <strong>PNG</strong> for lossless quality with transparency."
faq-input-q: "Which formats can I import?"
faq-input-a: "JPEG, PNG, GIF, TIFF and WebP. The EXIF orientation is applied automatically and animated GIFs are kept as animated WebP."
faq-resize-q: "Can I resize my images at the same time?"
faq-resize-a: "Yes. Turn on \"Resize\" and choose a width, a height, a longest side or a percentage: the proportions are kept and the final dimensions of each image are shown before the conversion. With \"Original format\", you can also resize without changing the format."
faq-context-menu-q: "Can I compress images without opening the application?"
faq-context-menu-a: "Yes. Right-click images or a folder: <strong>Compress with Lotpix</strong> offers WebP, JPEG, PNG, AVIF or the original format, and <strong>Resize with Lotpix</strong> offers standard sizes and social network formats (Instagram, Story, Facebook, X, YouTube, Pinterest). On Windows 11, the entries are under \"Show more options\"."
faq-image-converter-q: "I was using Image Converter, what should I do?"
faq-image-converter-a: "Lotpix is the new version of Image Converter, completely rewritten. It does not install over the old one: uninstall Image Converter, then install Lotpix from this page. The conversion history is not carried over."
faq-update-q: "How do I update the application?"
faq-update-a: "The application shows a banner at startup when a new version exists. Download it from this page or the GitHub releases, then install it over the old one."
faq-smartscreen-q: "Windows shows \"Windows protected your PC\", what should I do?"
faq-smartscreen-a: "Windows shows this warning for installers that are not signed yet or not downloaded enough yet. Click <strong>More info</strong>, then <strong>Run anyway</strong>. The installers are built publicly from the source code by GitHub Actions; signing by SignPath Foundation is being set up (see the code signing policy below)."
faq-macos-q: "Is there a macOS version?"
faq-macos-a: "Not as a prebuilt version yet. The code is open source under the MIT license, you can run the application from the sources by following the README."

# Code signing policy
signing-title: "Code signing policy"
signing-what-title: "What is signed"
signing-what-text: "The Windows application (<code>lotpix.exe</code>) and its installer are built and signed by the GitHub Actions <a href=\"{{ . }}\">release workflow</a>, only from the code of this repository. Each signature is approved by hand before it is applied. Versions published before signing was set up are not signed."
signing-team-title: "Team"
signing-committers: "Committers and reviewers:"
signing-approvers: "Approvers:"
privacy-title: "Privacy"
privacy-text: "Lotpix processes images on your computer: no image, file name or usage data is sent. The only network access is the check for a new version at startup, which reads the address of the latest release page on GitHub; it can be turned off with the \"Check for updates\" checkbox at the bottom of the window. This request is subject to the <a href=\"https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement\">GitHub privacy statement</a>."

