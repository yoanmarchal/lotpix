# FAQ
faq-title: "Häufige Fragen"
faq-another-question: "Eine andere Frage?"
faq-open-issue: "Eröffnen Sie ein Issue"
faq-uploads-q: "Werden meine Bilder ins Internet hochgeladen?"
faq-uploads-a: "Nein. Die gesamte Konvertierung erfolgt auf Ihrem Computer. Kein Bild verlässt Ihr Gerät und es werden keine Nutzungsdaten erfasst. Der einzige Netzwerkzugriff ist die Suche nach einer neuen Version beim Start, die Sie deaktivieren können."
faq-originals-q: "Werden meine Originaldateien verändert?"
faq-originals-a: "Niemals. Die konvertierten Bilder werden neben den Originalen oder im Ausgabeordner Ihrer Wahl erstellt. Auch wird nichts überschrieben: Wenn <code>photo.webp</code> bereits existiert, heißt die Ausgabe <code>photo-1.webp</code>."
faq-format-q: "Welches Format soll ich wählen?"
faq-format-a: "<strong>WebP</strong> für das Web, der beste Kompromiss. <strong>AVIF</strong> für die kleinsten Dateien. <strong>JPEG</strong>, wenn sich das Bild überall öffnen soll. <strong>PNG</strong> für verlustfreie Qualität mit Transparenz."
faq-input-q: "Welche Formate kann ich importieren?"
faq-input-a: "JPEG, PNG, GIF, TIFF und WebP. Die EXIF-Ausrichtung wird automatisch angewendet und animierte GIFs bleiben als animiertes WebP erhalten."
faq-resize-q: "Kann ich meine Bilder gleichzeitig skalieren?"
faq-resize-a: "Ja. Aktivieren Sie „Skalieren“ und wählen Sie eine Breite, eine Höhe, eine längste Seite oder einen Prozentsatz: Die Proportionen bleiben erhalten und die endgültigen Abmessungen jedes Bildes werden vor der Konvertierung angezeigt. Mit „Originalformat“ können Sie auch skalieren, ohne das Format zu ändern."
faq-context-menu-q: "Kann ich Bilder komprimieren, ohne die Anwendung zu öffnen?"
faq-context-menu-a: "Ja. Klicken Sie mit der rechten Maustaste auf Bilder oder einen Ordner: <strong>Mit Lotpix komprimieren</strong> bietet WebP, JPEG, PNG, AVIF oder das Originalformat, und <strong>Mit Lotpix skalieren</strong> bietet Standardgrößen und Formate für soziale Netzwerke (Instagram, Story, Facebook, X, YouTube, Pinterest). Unter Windows 11 befinden sich die Einträge unter „Weitere Optionen anzeigen“."
faq-image-converter-q: "Ich habe Image Converter verwendet, was muss ich tun?"
faq-image-converter-a: "Lotpix ist die neue, vollständig neu geschriebene Version von Image Converter. Sie wird nicht über die alte installiert: Deinstallieren Sie Image Converter und installieren Sie dann Lotpix von dieser Seite. Der Konvertierungsverlauf wird nicht übernommen."
faq-update-q: "Wie aktualisiere ich die Anwendung?"
faq-update-a: "Die Anwendung zeigt beim Start einen Hinweis an, wenn eine neue Version verfügbar ist. Laden Sie sie von dieser Seite oder den GitHub-Releases herunter und installieren Sie sie über die alte Version."
faq-smartscreen-q: "Windows zeigt „Der Computer wurde durch Windows geschützt“, was tun?"
faq-smartscreen-a: "Windows zeigt diese Warnung für Installationsprogramme, die noch nicht signiert oder noch nicht oft genug heruntergeladen wurden. Klicken Sie auf <strong>Weitere Informationen</strong> und dann auf <strong>Trotzdem ausführen</strong>. Die Installationsprogramme werden öffentlich von GitHub Actions aus dem Quellcode erstellt; die Signatur durch die SignPath Foundation wird gerade eingerichtet (siehe Signaturrichtlinie weiter unten)."
faq-macos-q: "Gibt es eine macOS-Version?"
faq-macos-a: "Noch keine vorkompilierte Version. Der Code ist Open Source unter der MIT-Lizenz, Sie können die Anwendung gemäß der README aus dem Quellcode starten."

# Signaturrichtlinie
signing-title: "Richtlinie zur Codesignatur"
signing-what-title: "Was signiert wird"
signing-what-text: "Die Windows-Anwendung (<code>lotpix.exe</code>) und ihr Installationsprogramm werden vom <a href=\"{{ . }}\">Release-Workflow</a> von GitHub Actions ausschließlich aus dem Code dieses Repositorys erstellt und signiert. Jede Signatur wird vor ihrer Anwendung manuell freigegeben. Vor der Einführung der Signatur veröffentlichte Versionen sind nicht signiert."
signing-team-title: "Team"
signing-committers: "Autoren und Prüfer:"
signing-approvers: "Freigabe der Signaturen:"
privacy-title: "Datenschutz"
privacy-text: "Lotpix verarbeitet die Bilder auf Ihrem Computer: Es werden keine Bilder, Dateinamen oder Nutzungsdaten übertragen. Der einzige Netzwerkzugriff ist die Suche nach einer neuen Version beim Start, die die Adresse der Seite des neuesten Releases auf GitHub liest; sie lässt sich über das Kontrollkästchen „Nach Updates suchen“ unten im Fenster deaktivieren. Diese Anfrage unterliegt der <a href=\"https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement\">Datenschutzerklärung von GitHub</a>."

