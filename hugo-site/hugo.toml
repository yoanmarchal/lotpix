baseURL = "https://yoanmarchal.github.io/lotpix/"
# English at the root, the other languages under /fr/, /es/ and /de/
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "rss", "sitemap", "section"]

[params]
  author = "Yoan Marchal"
  repo = "yoanmarchal/lotpix"
  github = "https://github.com/yoanmarchal/lotpix"
  releases = "https://github.com/yoanmarchal/lotpix/releases/latest"
  # Version shown until the GitHub API answers (updated client-side).
  version = "2.0.0"

# Titles and descriptions are in i18n/<language>.yaml; `ogLocale` feeds the Open Graph tags
[languages.en]
  languageName = "English"
  languageCode = "en"
  weight = 1
  [languages.en.params]
    ogLocale = "en_US"
[languages.fr]
  languageName = "Français"
  languageCode = "fr-FR"
  weight = 2
  [languages.fr.params]
    ogLocale = "fr_FR"
[languages.es]
  languageName = "Español"
  languageCode = "es-ES"
  weight = 3
  [languages.es.params]
    ogLocale = "es_ES"
[languages.de]
  languageName = "Deutsch"
  languageCode = "de-DE"
  weight = 4
  [languages.de.params]
    ogLocale = "de_DE"

[markup.goldmark.renderer]
  unsafe = true
