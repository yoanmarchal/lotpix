name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Un nouveau push annule la CI encore en cours sur la même branche ou PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 : les binaires restent compatibles avec les glibc plus anciennes
        os: [windows-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Cache Rust build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Les PRs relisent le cache de main sans en écrire un : la limite de 10 Go du dépôt n'est plus saturée
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check formatting
      run: cargo fmt --check

    - name: Run Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run Tests
      run: cargo test

    - name: Install cargo-packager
      run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

    - name: Build installers
      # On vérifie que le packaging fonctionne aussi, pas seulement la compilation
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          cargo packager --release --formats nsis
        else
          cargo packager --release --formats deb,appimage
        fi
