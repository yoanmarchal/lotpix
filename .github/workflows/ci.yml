name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push cancels the CI still running on the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04: the binaries stay compatible with older glibc versions
        os: [windows-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # rust-cache puts every installed toolchain in its key: without this cleanup, the Rust
    # preinstalled on the runner image (which varies from one machine to another) invalidates the cache
    - name: Keep only the pinned toolchain
      run: |
        rustc -V
        ACTIVE=$(rustup show active-toolchain | cut -d' ' -f1)
        for TOOLCHAIN in $(rustup toolchain list | cut -d' ' -f1); do
          [ "$TOOLCHAIN" = "$ACTIVE" ] || rustup toolchain uninstall "$TOOLCHAIN"
        done

    - name: Cache Rust build
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # Shared with release.yml (same value as the former key, based on the job name)
        shared-key: build
        # PRs read the main cache without writing one: the 10 GB repository limit is no longer saturated
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check formatting
      run: cargo fmt --check

    - name: Run Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run Tests
      run: cargo test

    - name: Install cargo-packager
      run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

    - name: Build installers
      # Checks that packaging works too, not only compilation
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          cargo packager --release --formats nsis
        else
          cargo packager --release --formats deb,appimage
        fi
