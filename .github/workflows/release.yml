name: Build and Release

on:
  # Every merge into main publishes a release, once the CI has passed
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Two merges close together must not compute the same version
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  check-tag:
    # Only after a successful CI on a push to main (not on a PR)
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check if release needed
        id: check
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Triggered by tag ${{ github.ref_name }}"
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # A more recent merge arrived: its CI will publish, with all the changes
          if [[ "$(git rev-parse origin/main)" != "$HEAD_SHA" ]]; then
            echo "main has moved past $HEAD_SHA. Skipping."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)
          # The CI, signing, Renovate and docs change nothing for the user
          if [[ -n "$LAST_TAG" ]] && ! git diff --name-only "$LAST_TAG" HEAD \
              | grep -qvE '^(\.github/|\.claude/|\.signpath/|renovate\.json$|.*\.md$)'; then
            echo "No app changes since $LAST_TAG. No new release."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          # Version already published: bump the patch. A version bumped by hand is kept as is
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            sed -i "0,/^version = \"$VERSION\"/s//version = \"$NEW_VERSION\"/" Cargo.toml
            sed -i "/^name = \"lotpix\"$/{n;s/^version = \".*\"/version = \"$NEW_VERSION\"/}" Cargo.lock
            git commit -am "Release v$NEW_VERSION"
            git push origin HEAD:main
            VERSION=$NEW_VERSION
          fi

          TAG_NAME="v$VERSION"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "Created and pushed tag $TAG_NAME"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        # Created only once here: the three builds then only upload their files to it
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  release:
    needs: check-tag
    if: needs.check-tag.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          # Ubuntu 22.04: the binaries stay compatible with older glibc versions
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: ubuntu-22.04-arm
            formats: deb,appimage
    defaults:
      run:
        shell: bash
    env:
      # Windows signing by SignPath Foundation (see the README, "Code signing policy").
      # Without the secret, for example in a fork, the release is published unsigned.
      # No variable named SIGN: linuxdeploy attempts a GPG signature of the AppImage as soon
      # as it exists, even set to "false"
      SIGNPATH_SIGNING: ${{ matrix.os == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != '' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag includes the version commit created by check-tag
          ref: ${{ needs.check-tag.outputs.tag }}

      - name: Read version
        id: version
        env:
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # rust-cache puts every installed toolchain in its key: without this cleanup, the Rust
      # preinstalled on the runner image (which varies from one machine to another) invalidates the cache
      - name: Keep only the pinned toolchain
        run: |
          rustc -V
          ACTIVE=$(rustup show active-toolchain | cut -d' ' -f1)
          for TOOLCHAIN in $(rustup toolchain list | cut -d' ' -f1); do
            [ "$TOOLCHAIN" = "$ACTIVE" ] || rustup toolchain uninstall "$TOOLCHAIN"
          done

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Same key as the CI: the release starts from the --release build the main CI just did
          shared-key: build
          # Only ARM, absent from the CI, needs to write its own cache
          save-if: ${{ matrix.os == 'ubuntu-22.04-arm' }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      # On Windows, lotpix.exe is signed before going into the installer, then the installer
      # itself. Each signature waits for the manual approval of the release in SignPath
      - name: Build application
        if: env.SIGNPATH_SIGNING == 'true'
        run: cargo build --release

      - name: Upload application for signing
        id: unsigned-app
        if: env.SIGNPATH_SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lotpix-exe-unsigned
          path: target/release/lotpix.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign application
        if: env.SIGNPATH_SIGNING == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: executable
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          # Time to approve the release in SignPath
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Use the signed application
        if: env.SIGNPATH_SIGNING == 'true'
        run: cp signed-app/lotpix.exe target/release/lotpix.exe

      - name: Build installers
        run: cargo packager --release --formats "${{ matrix.formats }}"

      # cargo-packager rebuilds before packaging: a rebuilt executable would no longer be signed
      - name: Check the packaged application is signed
        if: env.SIGNPATH_SIGNING == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature target/release/lotpix.exe
          if ($signature.Status -ne 'Valid') {
            throw "lotpix.exe is no longer signed: $($signature.Status)"
          }

      - name: Upload installer for signing
        id: unsigned-installer
        if: env.SIGNPATH_SIGNING == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lotpix-installer-unsigned
          path: release/lotpix_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        if: env.SIGNPATH_SIGNING == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Use the signed installer
        if: env.SIGNPATH_SIGNING == 'true'
        run: cp signed-installer/*.exe release/

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-tag.outputs.tag }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" release/*.exe release/*.deb release/*.AppImage --clobber

  # The site lives on the gh-pages branch: its deployment reads the latest published release
  update-site:
    needs: [check-tag, release]
    if: needs.check-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Redeploy the landing page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gh-pages.yml --repo "${{ github.repository }}" --ref gh-pages
