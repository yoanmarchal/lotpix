[package]
name = "lotpix"
version = "2.0.3"
edition = "2024"
description = "Bulk image optimizer : convertit, compresse et redimensionne des images par lot"
license = "MIT"
authors = ["Yoan Marchal <marchalyoan@gmail.com>"]
repository = "https://github.com/yoanmarchal/lotpix"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
fast_image_resize = "6"
iced = { version = "0.14", features = ["image", "tokio"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
libwebp-sys = "0.9"
lucide-icons = { version = "1.55.0", features = ["iced"] }
moxcms = "0.8"
notify-rust = "4.18.2"
open = "5.4.4"
# Sans la fonctionnalité « asm » : elle exige nasm à la compilation
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "sync"] }
ureq = "3.4.2"
webp = { version = "0.3", default-features = false }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true

# Les codecs sont inutilisables sans optimisation, même en développement
[profile.dev.package."*"]
opt-level = 3

# Installeurs : cargo packager --release --formats nsis (Windows) ou deb,appimage (Linux)
[package.metadata.packager]
product-name = "Lotpix"
identifier = "com.yoanmarchal.lotpix"
category = "GraphicsAndDesign"
publisher = "Yoan Marchal"
homepage = "https://github.com/yoanmarchal/lotpix"
long-description = "Convertit des images en WebP, JPEG, PNG ou AVIF, les compresse et les redimensionne par lot."
license-file = "LICENSE"
before-packaging-command = "cargo build --release"
out-dir = "release"
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/icon.ico",
]

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
languages = ["French", "English"]
# Menu contextuel de l'Explorateur, sur les images, les dossiers et le fond d'un dossier.
# Les entrées classiques apparaissent sous « Afficher plus d'options » dans Windows 11.
# MultiSelectModel = Player lève la limite de 15 fichiers sélectionnés ; Windows lance alors
# un processus par fichier, que l'application regroupe (src/queue.rs)
preinstall-section = '''
!macro LotpixVerb KEY VERB LABEL MODE ARGUMENT
  WriteRegStr SHCTX "Software\Classes\${KEY}\shell\${VERB}" "MUIVerb" "${LABEL}"
  WriteRegStr SHCTX "Software\Classes\${KEY}\shell\${VERB}" "Icon" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\",0"
  WriteRegStr SHCTX "Software\Classes\${KEY}\shell\${VERB}" "MultiSelectModel" "Player"
  WriteRegStr SHCTX "Software\Classes\${KEY}\shell\${VERB}\command" "" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\" ${MODE} $\"${ARGUMENT}$\""
!macroend

!macro LotpixMenu KEY ARGUMENT
  !insertmacro LotpixVerb "${KEY}" "Lotpix.Compress" "Compresser avec Lotpix" "compress" "${ARGUMENT}"
  !insertmacro LotpixVerb "${KEY}" "Lotpix.Open" "Ouvrir dans Lotpix" "open" "${ARGUMENT}"
!macroend

!macro LotpixMenuRemove KEY _ARGUMENT
  DeleteRegKey SHCTX "Software\Classes\${KEY}\shell\Lotpix.Compress"
  DeleteRegKey SHCTX "Software\Classes\${KEY}\shell\Lotpix.Open"
!macroend

!macro LotpixMenus MACRO
  !insertmacro ${MACRO} "SystemFileAssociations\.jpg" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.jpeg" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.png" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.gif" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.tif" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.tiff" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.webp" "%1"
  !insertmacro ${MACRO} "Directory" "%1"
  !insertmacro ${MACRO} "Directory\Background" "%V"
!macroend

Section ContextMenu
  !insertmacro LotpixMenus LotpixMenu
SectionEnd

Section un.ContextMenu
  !insertmacro LotpixMenus LotpixMenuRemove
SectionEnd
'''

# Menus contextuels de Dolphin (KDE) et de Nemo (Cinnamon)
[package.metadata.packager.deb]
files = { "packaging/linux/lotpix-dolphin.desktop" = "/usr/share/kio/servicemenus/lotpix.desktop", "packaging/linux/lotpix-compress.nemo_action" = "/usr/share/nemo/actions/lotpix-compress.nemo_action", "packaging/linux/lotpix-open.nemo_action" = "/usr/share/nemo/actions/lotpix-open.nemo_action" }
