[package]
name = "lotpix"
version = "2.0.6"
edition = "2024"
description = "Bulk image optimizer : convertit, compresse et redimensionne des images par lot"
license = "MIT"
authors = ["Yoan Marchal <marchalyoan@gmail.com>"]
repository = "https://github.com/yoanmarchal/lotpix"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
fast_image_resize = "6"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
iced = { version = "0.14", features = ["image", "tokio"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
libwebp-sys = "0.9"
lucide-icons = { version = "1.55.0", features = ["iced"] }
moxcms = "0.8"
notify-rust = "4.18.2"
open = "5.4.4"
# Sans la fonctionnalité « asm » : elle exige nasm à la compilation
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rfd = "0.17"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "sync"] }
unic-langid = "0.9.6"
ureq = "3.4.2"
webp = { version = "0.3", default-features = false }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true

# Les codecs sont inutilisables sans optimisation, même en développement
[profile.dev.package."*"]
opt-level = 3

# Installeurs : cargo packager --release --formats nsis (Windows) ou deb,appimage (Linux)
[package.metadata.packager]
product-name = "Lotpix"
identifier = "com.yoanmarchal.lotpix"
category = "GraphicsAndDesign"
publisher = "Yoan Marchal"
homepage = "https://github.com/yoanmarchal/lotpix"
long-description = "Convertit des images en WebP, JPEG, PNG ou AVIF, les compresse et les redimensionne par lot."
license-file = "LICENSE"
before-packaging-command = "cargo build --release"
out-dir = "release"
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/icon.ico",
]

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
languages = ["French", "English"]
# Menu contextuel de l'Explorateur, sur les images, les dossiers et le fond d'un dossier :
# « Compresser avec Lotpix » et « Redimensionner avec Lotpix » ouvrent un sous-menu, avec
# les réglages recommandés (src/presets.rs) ; « Ouvrir dans Lotpix » ouvre l'interface.
# Les entrées classiques apparaissent sous « Afficher plus d'options » dans Windows 11.
# MultiSelectModel = Player lève la limite de 15 fichiers sélectionnés ; Windows lance alors
# un processus par fichier, que l'application regroupe (src/queue.rs)
preinstall-section = '''
!macro LotpixCommand KEY LABEL ARGUMENTS ARGUMENT
  WriteRegStr SHCTX "${KEY}" "MUIVerb" "${LABEL}"
  WriteRegStr SHCTX "${KEY}" "MultiSelectModel" "Player"
  WriteRegStr SHCTX "${KEY}\command" "" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\" ${ARGUMENTS} $\"${ARGUMENT}$\""
!macroend

!macro LotpixSubmenu KEY LABEL
  WriteRegStr SHCTX "${KEY}" "MUIVerb" "${LABEL}"
  WriteRegStr SHCTX "${KEY}" "Icon" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\",0"
  WriteRegStr SHCTX "${KEY}" "MultiSelectModel" "Player"
  WriteRegStr SHCTX "${KEY}" "SubCommands" ""
!macroend

!macro LotpixMenuRemove CLASS _ARGUMENT
  DeleteRegKey SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Compress"
  DeleteRegKey SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Resize"
  DeleteRegKey SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Open"
!macroend

!macro LotpixMenu CLASS ARGUMENT
  ; Repart de zéro : une version précédente a pu laisser d'autres entrées
  !insertmacro LotpixMenuRemove "${CLASS}" "${ARGUMENT}"

  ; Les entrées d'un sous-menu sont triées par nom de clé
  !insertmacro LotpixSubmenu "Software\Classes\${CLASS}\shell\Lotpix.Compress" "Compresser avec Lotpix"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\1-webp" "WebP" "compress --format webp" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\2-jpg" "JPEG" "compress --format jpg" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\3-png" "PNG (sans perte)" "compress --format png" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\4-avif" "AVIF" "compress --format avif" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\5-original" "Format d'origine" "compress --format original" "${ARGUMENT}"

  !insertmacro LotpixSubmenu "Software\Classes\${CLASS}\shell\Lotpix.Resize" "Redimensionner avec Lotpix"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\01-4k" "4K (3840 px)" "resize --size 4k" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\02-full-hd" "Full HD (1920 px)" "resize --size full-hd" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\03-hd" "HD (1280 px)" "resize --size hd" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\04-web" "Web (1024 px)" "resize --size web" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\05-thumbnail" "Miniature (640 px)" "resize --size thumbnail" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\06-half" "50 %" "resize --size half" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\07-instagram-square" "Instagram carré (1080 × 1080)" "resize --size instagram-square" "${ARGUMENT}"
  ; Séparateur avant les réseaux sociaux (ECF_SEPARATORBEFORE)
  WriteRegDWORD SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\07-instagram-square" "CommandFlags" 0x20
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\08-instagram-portrait" "Instagram portrait (1080 × 1350)" "resize --size instagram-portrait" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\09-story" "Story, Reels, TikTok (1080 × 1920)" "resize --size story" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\10-facebook" "Facebook, LinkedIn (1200 × 630)" "resize --size facebook" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\11-x" "X (1600 × 900)" "resize --size x" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\12-youtube" "Miniature YouTube (1280 × 720)" "resize --size youtube" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\13-pinterest" "Pinterest (1000 × 1500)" "resize --size pinterest" "${ARGUMENT}"

  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Open" "Ouvrir dans Lotpix" "open" "${ARGUMENT}"
  WriteRegStr SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Open" "Icon" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\",0"
!macroend

!macro LotpixMenus MACRO
  !insertmacro ${MACRO} "SystemFileAssociations\.jpg" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.jpeg" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.png" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.gif" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.tif" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.tiff" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.webp" "%1"
  !insertmacro ${MACRO} "Directory" "%1"
  !insertmacro ${MACRO} "Directory\Background" "%V"
!macroend

Section ContextMenu
  !insertmacro LotpixMenus LotpixMenu
SectionEnd

Section un.ContextMenu
  !insertmacro LotpixMenus LotpixMenuRemove
SectionEnd
'''

# Menus contextuels de Dolphin (KDE) et de Nemo (Cinnamon)
[package.metadata.packager.deb]
files = { "packaging/linux/dolphin" = "/usr/share/kio/servicemenus", "packaging/linux/nemo" = "/usr/share/nemo/actions" }
