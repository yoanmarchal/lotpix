[package]
name = "lotpix"
version = "2.0.8"
edition = "2024"
description = "Bulk image optimizer : convertit, compresse et redimensionne des images par lot"
license = "MIT"
authors = ["Yoan Marchal <marchalyoan@gmail.com>"]
repository = "https://github.com/yoanmarchal/lotpix"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
fast_image_resize = "6"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
iced = { version = "0.14", features = ["image", "tokio"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "tiff", "webp"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
libwebp-sys = "0.9"
lucide-icons = { version = "1.55.0", features = ["iced"] }
moxcms = "0.8"
notify-rust = "4.18.2"
open = "5.4.4"
# Sans la fonctionnalité « asm » : elle exige nasm à la compilation
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rfd = "0.17"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "sync"] }
unic-langid = "0.9.6"
ureq = "3.4.2"
webp = { version = "0.3", default-features = false }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true

# Les codecs sont inutilisables sans optimisation, même en développement
[profile.dev.package."*"]
opt-level = 3

# Installeurs : cargo packager --release --formats nsis (Windows) ou deb,appimage (Linux)
[package.metadata.packager]
product-name = "Lotpix"
identifier = "com.yoanmarchal.lotpix"
category = "GraphicsAndDesign"
publisher = "Yoan Marchal"
homepage = "https://github.com/yoanmarchal/lotpix"
long-description = "Convertit des images en WebP, JPEG, PNG ou AVIF, les compresse et les redimensionne par lot."
license-file = "LICENSE"
before-packaging-command = "cargo build --release"
out-dir = "release"
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/icon.ico",
]

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"
# La première langue sert quand celle du système n'est pas dans la liste
languages = ["English", "French", "Spanish", "German"]
# cargo-packager ne traduit pas ses propres messages en allemand
custom-language-file = { German = "packaging/windows/German.nsh" }
# Début du menu contextuel de l'Explorateur. Généré par `LOTPIX_UPDATE_MENUS=1 cargo test` (src/context_menu.rs) : ne pas modifier à la main.
# « Compresser avec Lotpix » et « Redimensionner avec Lotpix » ouvrent un sous-menu, avec les
# réglages recommandés (src/presets.rs) ; « Ouvrir dans Lotpix » ouvre l'interface. Les libellés
# sont écrits dans la langue de l'installation. Les entrées classiques apparaissent sous
# « Afficher plus d'options » dans Windows 11. MultiSelectModel = Player lève la limite de
# 15 fichiers sélectionnés ; Windows lance alors un processus par fichier, que l'application
# regroupe (src/queue.rs)
preinstall-section = '''
!macro LotpixCommand KEY LABEL ARGUMENTS ARGUMENT
  WriteRegStr SHCTX "${KEY}" "MUIVerb" "${LABEL}"
  WriteRegStr SHCTX "${KEY}" "MultiSelectModel" "Player"
  WriteRegStr SHCTX "${KEY}\command" "" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\" ${ARGUMENTS} $\"${ARGUMENT}$\""
!macroend

!macro LotpixSubmenu KEY LABEL
  WriteRegStr SHCTX "${KEY}" "MUIVerb" "${LABEL}"
  WriteRegStr SHCTX "${KEY}" "Icon" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\",0"
  WriteRegStr SHCTX "${KEY}" "MultiSelectModel" "Player"
  WriteRegStr SHCTX "${KEY}" "SubCommands" ""
!macroend

!macro LotpixMenuRemove CLASS _ARGUMENT
  DeleteRegKey SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Compress"
  DeleteRegKey SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Resize"
  DeleteRegKey SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Open"
!macroend

; Libellés dans la langue de l'installation
LangString lotpix_compress ${LANG_ENGLISH} "Compress with Lotpix"
LangString lotpix_compress ${LANG_FRENCH} "Compresser avec Lotpix"
LangString lotpix_compress ${LANG_SPANISH} "Comprimir con Lotpix"
LangString lotpix_compress ${LANG_GERMAN} "Mit Lotpix komprimieren"
LangString lotpix_resize ${LANG_ENGLISH} "Resize with Lotpix"
LangString lotpix_resize ${LANG_FRENCH} "Redimensionner avec Lotpix"
LangString lotpix_resize ${LANG_SPANISH} "Redimensionar con Lotpix"
LangString lotpix_resize ${LANG_GERMAN} "Mit Lotpix skalieren"
LangString lotpix_open ${LANG_ENGLISH} "Open in Lotpix"
LangString lotpix_open ${LANG_FRENCH} "Ouvrir dans Lotpix"
