LangString lotpix_open ${LANG_GERMAN} "In Lotpix öffnen"
LangString lotpix_compress_webp ${LANG_ENGLISH} "WebP"
LangString lotpix_compress_webp ${LANG_FRENCH} "WebP"
LangString lotpix_compress_webp ${LANG_SPANISH} "WebP"
LangString lotpix_compress_webp ${LANG_GERMAN} "WebP"
LangString lotpix_compress_jpg ${LANG_ENGLISH} "JPEG"
LangString lotpix_compress_jpg ${LANG_FRENCH} "JPEG"
LangString lotpix_compress_jpg ${LANG_SPANISH} "JPEG"
LangString lotpix_compress_jpg ${LANG_GERMAN} "JPEG"
LangString lotpix_compress_png ${LANG_ENGLISH} "PNG (lossless)"
LangString lotpix_compress_png ${LANG_FRENCH} "PNG (sans perte)"
LangString lotpix_compress_png ${LANG_SPANISH} "PNG (sin pérdida)"
LangString lotpix_compress_png ${LANG_GERMAN} "PNG (verlustfrei)"
LangString lotpix_compress_avif ${LANG_ENGLISH} "AVIF"
LangString lotpix_compress_avif ${LANG_FRENCH} "AVIF"
LangString lotpix_compress_avif ${LANG_SPANISH} "AVIF"
LangString lotpix_compress_avif ${LANG_GERMAN} "AVIF"
LangString lotpix_compress_original ${LANG_ENGLISH} "Original format"
LangString lotpix_compress_original ${LANG_FRENCH} "Format d'origine"
LangString lotpix_compress_original ${LANG_SPANISH} "Formato original"
LangString lotpix_compress_original ${LANG_GERMAN} "Originalformat"
LangString lotpix_resize_4k ${LANG_ENGLISH} "4K (3840 px)"
LangString lotpix_resize_4k ${LANG_FRENCH} "4K (3840 px)"
LangString lotpix_resize_4k ${LANG_SPANISH} "4K (3840 px)"
LangString lotpix_resize_4k ${LANG_GERMAN} "4K (3840 px)"
LangString lotpix_resize_full_hd ${LANG_ENGLISH} "Full HD (1920 px)"
LangString lotpix_resize_full_hd ${LANG_FRENCH} "Full HD (1920 px)"
LangString lotpix_resize_full_hd ${LANG_SPANISH} "Full HD (1920 px)"
LangString lotpix_resize_full_hd ${LANG_GERMAN} "Full HD (1920 px)"
LangString lotpix_resize_hd ${LANG_ENGLISH} "HD (1280 px)"
LangString lotpix_resize_hd ${LANG_FRENCH} "HD (1280 px)"
LangString lotpix_resize_hd ${LANG_SPANISH} "HD (1280 px)"
LangString lotpix_resize_hd ${LANG_GERMAN} "HD (1280 px)"
LangString lotpix_resize_web ${LANG_ENGLISH} "Web (1024 px)"
LangString lotpix_resize_web ${LANG_FRENCH} "Web (1024 px)"
LangString lotpix_resize_web ${LANG_SPANISH} "Web (1024 px)"
LangString lotpix_resize_web ${LANG_GERMAN} "Web (1024 px)"
LangString lotpix_resize_thumbnail ${LANG_ENGLISH} "Thumbnail (640 px)"
LangString lotpix_resize_thumbnail ${LANG_FRENCH} "Miniature (640 px)"
LangString lotpix_resize_thumbnail ${LANG_SPANISH} "Miniatura (640 px)"
LangString lotpix_resize_thumbnail ${LANG_GERMAN} "Miniatur (640 px)"
LangString lotpix_resize_half ${LANG_ENGLISH} "50%"
LangString lotpix_resize_half ${LANG_FRENCH} "50 %"
LangString lotpix_resize_half ${LANG_SPANISH} "50 %"
LangString lotpix_resize_half ${LANG_GERMAN} "50 %"
LangString lotpix_resize_instagram_square ${LANG_ENGLISH} "Instagram square (1080 × 1080)"
LangString lotpix_resize_instagram_square ${LANG_FRENCH} "Instagram carré (1080 × 1080)"
LangString lotpix_resize_instagram_square ${LANG_SPANISH} "Instagram cuadrado (1080 × 1080)"
LangString lotpix_resize_instagram_square ${LANG_GERMAN} "Instagram quadratisch (1080 × 1080)"
LangString lotpix_resize_instagram_portrait ${LANG_ENGLISH} "Instagram portrait (1080 × 1350)"
LangString lotpix_resize_instagram_portrait ${LANG_FRENCH} "Instagram portrait (1080 × 1350)"
LangString lotpix_resize_instagram_portrait ${LANG_SPANISH} "Instagram vertical (1080 × 1350)"
LangString lotpix_resize_instagram_portrait ${LANG_GERMAN} "Instagram Hochformat (1080 × 1350)"
LangString lotpix_resize_story ${LANG_ENGLISH} "Story, Reels, TikTok (1080 × 1920)"
LangString lotpix_resize_story ${LANG_FRENCH} "Story, Reels, TikTok (1080 × 1920)"
LangString lotpix_resize_story ${LANG_SPANISH} "Stories, Reels, TikTok (1080 × 1920)"
LangString lotpix_resize_story ${LANG_GERMAN} "Story, Reels, TikTok (1080 × 1920)"
LangString lotpix_resize_facebook ${LANG_ENGLISH} "Facebook, LinkedIn (1200 × 630)"
LangString lotpix_resize_facebook ${LANG_FRENCH} "Facebook, LinkedIn (1200 × 630)"
LangString lotpix_resize_facebook ${LANG_SPANISH} "Facebook, LinkedIn (1200 × 630)"
LangString lotpix_resize_facebook ${LANG_GERMAN} "Facebook, LinkedIn (1200 × 630)"
LangString lotpix_resize_x ${LANG_ENGLISH} "X (1600 × 900)"
LangString lotpix_resize_x ${LANG_FRENCH} "X (1600 × 900)"
LangString lotpix_resize_x ${LANG_SPANISH} "X (1600 × 900)"
LangString lotpix_resize_x ${LANG_GERMAN} "X (1600 × 900)"
LangString lotpix_resize_youtube ${LANG_ENGLISH} "YouTube thumbnail (1280 × 720)"
LangString lotpix_resize_youtube ${LANG_FRENCH} "Miniature YouTube (1280 × 720)"
LangString lotpix_resize_youtube ${LANG_SPANISH} "Miniatura de YouTube (1280 × 720)"
LangString lotpix_resize_youtube ${LANG_GERMAN} "YouTube-Vorschaubild (1280 × 720)"
LangString lotpix_resize_pinterest ${LANG_ENGLISH} "Pinterest (1000 × 1500)"
LangString lotpix_resize_pinterest ${LANG_FRENCH} "Pinterest (1000 × 1500)"
LangString lotpix_resize_pinterest ${LANG_SPANISH} "Pinterest (1000 × 1500)"
LangString lotpix_resize_pinterest ${LANG_GERMAN} "Pinterest (1000 × 1500)"

!macro LotpixMenu CLASS ARGUMENT
  ; Repart de zéro : une version précédente a pu laisser d'autres entrées
  !insertmacro LotpixMenuRemove "${CLASS}" "${ARGUMENT}"

  !insertmacro LotpixSubmenu "Software\Classes\${CLASS}\shell\Lotpix.Compress" "$(lotpix_compress)"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\01-webp" "$(lotpix_compress_webp)" "compress --format webp" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\02-jpg" "$(lotpix_compress_jpg)" "compress --format jpg" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\03-png" "$(lotpix_compress_png)" "compress --format png" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\04-avif" "$(lotpix_compress_avif)" "compress --format avif" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Compress\shell\05-original" "$(lotpix_compress_original)" "compress --format original" "${ARGUMENT}"

  !insertmacro LotpixSubmenu "Software\Classes\${CLASS}\shell\Lotpix.Resize" "$(lotpix_resize)"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\01-4k" "$(lotpix_resize_4k)" "resize --size 4k" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\02-full-hd" "$(lotpix_resize_full_hd)" "resize --size full-hd" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\03-hd" "$(lotpix_resize_hd)" "resize --size hd" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\04-web" "$(lotpix_resize_web)" "resize --size web" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\05-thumbnail" "$(lotpix_resize_thumbnail)" "resize --size thumbnail" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\06-half" "$(lotpix_resize_half)" "resize --size half" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\07-instagram-square" "$(lotpix_resize_instagram_square)" "resize --size instagram-square" "${ARGUMENT}"
  ; Séparateur avant les réseaux sociaux (ECF_SEPARATORBEFORE)
  WriteRegDWORD SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\07-instagram-square" "CommandFlags" 0x20
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\08-instagram-portrait" "$(lotpix_resize_instagram_portrait)" "resize --size instagram-portrait" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\09-story" "$(lotpix_resize_story)" "resize --size story" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\10-facebook" "$(lotpix_resize_facebook)" "resize --size facebook" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\11-x" "$(lotpix_resize_x)" "resize --size x" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\12-youtube" "$(lotpix_resize_youtube)" "resize --size youtube" "${ARGUMENT}"
  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Resize\shell\13-pinterest" "$(lotpix_resize_pinterest)" "resize --size pinterest" "${ARGUMENT}"

  !insertmacro LotpixCommand "Software\Classes\${CLASS}\shell\Lotpix.Open" "$(lotpix_open)" "open" "${ARGUMENT}"
  WriteRegStr SHCTX "Software\Classes\${CLASS}\shell\Lotpix.Open" "Icon" "$\"$INSTDIR\${MAINBINARYNAME}.exe$\",0"
!macroend

!macro LotpixMenus MACRO
  !insertmacro ${MACRO} "SystemFileAssociations\.jpg" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.jpeg" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.png" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.gif" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.tif" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.tiff" "%1"
  !insertmacro ${MACRO} "SystemFileAssociations\.webp" "%1"
  !insertmacro ${MACRO} "Directory" "%1"
  !insertmacro ${MACRO} "Directory\Background" "%V"
!macroend

Section ContextMenu
  !insertmacro LotpixMenus LotpixMenu
SectionEnd

Section un.ContextMenu
  !insertmacro LotpixMenus LotpixMenuRemove
SectionEnd
'''
# Fin du menu contextuel de l'Explorateur

# Menus contextuels de Dolphin (KDE) et de Nemo (Cinnamon)
[package.metadata.packager.deb]
files = { "packaging/linux/dolphin" = "/usr/share/kio/servicemenus", "packaging/linux/nemo" = "/usr/share/nemo/actions" }
