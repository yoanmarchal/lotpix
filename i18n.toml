# Fluent translations (src/i18n.rs): one i18n/<language>/lotpix.ftl file per language.
# English is the reference: the fl! macro refuses to compile a key missing from
# i18n/en/lotpix.ftl, and it is the language used when the system one is not translated
fallback_language = "en"

[fluent]
assets_dir = "i18n"
